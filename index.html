<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票紀錄</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  /* 大地色系 (Earth Tones) 主題配置 */
  --paper: #EFEAE0;         /* 燕麥米色背景 */
  --card: #FFFDF8;          /* 暖白卡片背景 */
  --ink: #2D2721;           /* 深咖啡黑文字 */
  --navy: #5C4033;          /* 深暖棕色 */
  --navy-light: #7A5745;    /* 淺暖棕色 */
  --brass: #d6b784;         /* 黃銅金 */
  --brass-light: #c2a571;   /* 明亮金 */
  --red: #ed4d3b;           /* 磚紅色 */
  --green: #51a882;         /* 森林綠 */
  --line: #D9D0BC;          /* 淺沙色分割線 */
  --muted: #736C5E;         /* 風化灰棕 */
  --font-display: 'Noto Serif TC', serif;
  --font-body: 'Noto Sans TC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); 
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---------- header / cover ---------- */
.cover{
  background:linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 100%);
  color:#EFE7D6;
  padding:28px 20px 20px;
  position:relative;
  overflow:hidden;
}
.cover::after{
  content:"";
  position:absolute;
  right:-40px; top:-40px;
  width:180px; height:180px;
  border:1px solid rgba(233,214,166,0.18);
  border-radius:50%;
}
.cover-inner{
  max-width:1040px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  position:relative;
  z-index:1;
}
.cover-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:26px;
  letter-spacing:0.02em;
  margin:0;
}
.cover-sub{
  margin:6px 0 0;
  font-size:13px;
  color:#D1D5DB;
  font-family:var(--font-mono);
}
.stamp{
  width:56px;height:56px;
  border-radius:50%;
  border:2px solid var(--brass-light);
  color:var(--brass-light);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);
  font-size:20px;font-weight:700;
  flex-shrink:0;
  transform:rotate(-6deg);
}

/* ---------- tabs ---------- */
.tabs{
  background:var(--navy);
  border-top:1px solid rgba(255,255,255,0.08);
  overflow-x:auto;
  white-space:nowrap;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tabs-inner{
  max-width:1040px;
  margin:0 auto;
  display:flex;
}
.tab-btn{
  background:none;
  border:none;
  color:#E5E7EB;
  font-family:var(--font-body);
  font-weight:500;
  font-size:14px;
  padding:14px 18px;
  cursor:pointer;
  border-bottom:3px solid transparent;
  white-space:nowrap;
  display:flex;
  align-items:baseline;
  gap:6px;
}
.tab-btn .num{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--brass-light);
}
.tab-btn.active{
  color:#F5EFDF;
  border-bottom-color:var(--brass-light);
}

/* ---------- layout ---------- */
main{
  max-width:1040px;
  margin:0 auto;
  padding:24px 20px 60px;
}
.section-title{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:700;
  margin:0 0 4px;
  color:var(--navy);
}
.section-desc{
  font-size:13px;
  color:var(--muted);
  margin:0 0 20px;
}

/* ---------- cards & grid ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--brass);
  border-radius: 4px;
  padding: 16px 18px;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
}

.grid-4 {
  display: grid !important;
  grid-template-columns: repeat(4, 1fr) !important;
  gap: 12px !important;
  width: 100%;
}

.grid-2 {
  display: grid !important;
  grid-template-columns: repeat(2, 1fr) !important;
  gap: 12px !important;
  width: 100%;
}

.holder-card {
  display: flex;
  flex-direction: column;
}

.holder-card .holder-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  color: var(--navy);
  margin: 0 0 10px;
}

.metric-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 13.5px;
  width: 100%;
}

.metric-row .label { color: var(--muted); }
.metric-row .value { 
  font-family: var(--font-mono); 
  font-weight: 600;
  white-space: nowrap;
}

@media(max-width: 760px) {
  .grid-4 { 
    grid-template-columns: repeat(2, 1fr) !important; 
  }
  .grid-2 { 
    grid-template-columns: 1fr !important; 
  }
}

.total-bar{
  background:var(--navy);
  color:#F0EAD9;
  border-radius:4px;
  padding:18px 20px;
  margin-bottom:20px;
  display:flex;
  flex-wrap:wrap;
  gap:24px;
  align-items:center;
}
.total-bar .metric-label{
  color:#E5E7EB;
  font-size:12px;
  font-family:var(--font-mono);
}
.total-bar .metric-value{font-family:var(--font-mono);font-size:22px;font-weight:600;}

.gain{color:var(--red);}
.loss{color:var(--green);}
.flat{color:var(--muted);}

/* ---------- 表格與容器 ---------- */
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--card);
  width: 100%;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  min-width: 780px;
}

thead th, tbody td {
  padding: 10px 12px;
  white-space: nowrap;
}

tbody td.txt{font-family:var(--font-body);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#F9F6EE;}
.num-col{text-align:right;}

.pill{
  display:inline-block;
  padding:2px 9px;
  border-radius:20px;
  font-size:12px;
  font-family:var(--font-body);
  font-weight:500;
  background:#EFE7D2;
  color:var(--navy);
}
.pill.sell{background:#EADAD6;color:var(--red);}
.pill.buy{background:#DCE7DF;color:var(--green);}

.icon-btn{
  border:none;background:none;cursor:pointer;
  color:var(--muted);font-size:15px;
  padding:2px 6px;
}
.icon-btn:hover{color:var(--red);}

/* ---------- forms ---------- */
.form-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:4px;
  padding:18px;
  margin-bottom:18px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
@media(max-width: 760px){
  main {
    padding: 12px 10px 40px;
  }
  .form-grid { 
    grid-template-columns: 1fr !important; 
  }
  .field[style*="grid-column"] { 
    grid-column: span 1 !important; 
  }
  .total-bar {
    gap: 12px;
    padding: 12px 14px;
  }
  .total-bar .metric-value {
    font-size: 18px;
  }
}

.field input, .field select {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  font-family: var(--font-body);
  font-size: 14px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: #fff;
  color: var(--ink);
}
.field input:focus, .field select:focus{outline:2px solid var(--brass-light);outline-offset:1px;}
.form-actions{margin-top:14px;display:flex;gap:10px;align-items:center;}
.btn{
  font-family:var(--font-body);
  font-weight:600;
  font-size:13.5px;
  padding:9px 18px;
  border-radius:3px;
  border:1px solid var(--navy);
  background:var(--navy);
  color:#F0EAD9;
  cursor:pointer;
}
.btn:hover{background:var(--navy-light);}
.btn.secondary{background:transparent;color:var(--navy);}
.hint{font-size:12px;color:var(--muted);}

/* ---------- holder pills nav ---------- */
.holder-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.holder-select button{
  font-family:var(--font-body);
  font-size:13.5px;
  padding:7px 16px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  cursor:pointer;
}
.holder-select button.active{
  background:var(--navy);
  color:#F0EAD9;
  border-color:var(--navy);
}

.empty-state{
  text-align:center;
  padding:36px 20px;
  color:var(--muted);
  font-size:13.5px;
}

.price-input{
  width:80px;
  font-family:var(--font-mono);
  padding:4px 6px;
  border:1px solid var(--line);
  border-radius:3px;
}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#F0EAD9;
  padding:10px 20px;border-radius:4px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .25s;
  z-index:50;
}
.toast.show{opacity:1;}

.new-holder-row{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  align-items:center;
  flex-wrap: wrap;
}
.new-holder-row input{
  padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-family:var(--font-body);font-size:13px;
}
</style>
</head>
<body>

<header class="cover">
  <div class="cover-inner">
    <div>
      <p class="cover-title">股票紀錄</p>
      <p class="cover-sub" id="holderListSub">本人・阿寶・媽媽・挖貴</p>
    </div>
    <div class="stamp">帳</div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" id="tabsInner"></div>
</nav>

<main id="app">
  <div class="empty-state">載入中…</div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ================= Google Sheets API Setup ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzT8rvsYlbJtT2FakIZxGgphf5gDgM9rqietzRAV9DueZN7b5hWt-BhVoXzWf67c68Yyg/exec"; 

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ================= state ================= */
let state={
  holders:['本人','阿寶','媽媽','挖貴'],
  transactions:[], 
  cashflow:[],     
  prices:{},       
  stocks:{'2330':'台積電', '0050':'元大台灣50'},
  activeTab:'01',
  personalHolder:null
};

const TABS=[
  {id:'01',label:'總覽'},
  {id:'02',label:'交易明細'},
  {id:'03',label:'持股總表'},
  {id:'04',label:'個人資產'},
  {id:'05',label:'資金往來與代管帳戶'}
];

/* ================= API 串接與儲存 ================= */
async function fetchFromGoogleSheet(){
  try{
    showToast('連線中，載入雲端資料...');
    const res = await fetch(API_URL);
    const data = await res.json();
    
    if(data){
      if(data.holders && data.holders.length > 0) state.holders = data.holders;
      state.transactions = data.transactions || [];
      state.cashflow = data.cashflow || [];
      state.prices = data.prices || {};
      if(data.stocks && Object.keys(data.stocks).length > 0) state.stocks = data.stocks;
    }
  }catch(e){
    console.error('Fetch Google Sheet Failed:', e);
    showToast('雲端資料載入失敗，將使用預設畫面');
  }
}

async function saveToGoogleSheet(){
  try{
    showToast('雲端同步儲存中...');
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        type: 'saveAll',
        holders: state.holders,
        transactions: state.transactions,
        cashflow: state.cashflow,
        prices: state.prices,
        stocks: state.stocks
      })
    });
    showToast('已同步儲存至 Google 試算表！');
  }catch(e){
    console.error('Save Google Sheet Failed:', e);
    showToast('儲存失敗，請檢查網路連線');
  }
}

/* ================= formatting ================= */
function fmtMoney(n){
  n = Math.round(n||0);
  return (n<0?'-':'')+'NT$'+Math.abs(n).toLocaleString('zh-Hant-TW');
}
function fmtNum(n,d=0){
  n = n||0;
  return n.toLocaleString('zh-Hant-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtPct(n){
  if(!isFinite(n)) return '—';
  return (n>=0?'+':'')+n.toFixed(1)+'%';
}
function pnlClass(n){ return n>0?'gain':(n<0?'loss':'flat'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ================= computation ================= */
function computeHoldings(){
  const sorted=[...state.transactions].sort((a,b)=> (a.date<b.date?-1:a.date>b.date?1:0));
  const map={}; 
  for(const t of sorted){
    const key=t.holder+'|'+t.code;
    if(!map[key]) map[key]={holder:t.holder,code:t.code,name:t.name,shares:0,costBasis:0,realizedPnl:0};
    const h=map[key];
    h.name=t.name||h.name;
    const shares=Number(t.shares)||0;
    const price=Number(t.price)||0;
    const fee=Number(t.fee)||0;
    if(t.action==='buy'){
      h.costBasis += shares*price + fee;
      h.shares += shares;
    }else{ 
      const avgCost = h.shares>0 ? h.costBasis/h.shares : 0;
      const sellShares = Math.min(shares, h.shares>0?h.shares:shares);
      const proceeds = shares*price - fee;
      h.realizedPnl += proceeds - sellShares*avgCost;
      h.costBasis -= sellShares*avgCost;
      h.shares -= shares;
      if(h.shares<0.0001) { h.shares=Math.max(h.shares,0); }
      if(h.shares<=0){ h.costBasis=0; h.shares=0; }
    }
  }
  return Object.values(map);
}

function computeHolderSummary(holdings){
  const byHolder={};
  for(const h of holdings){
    if(!byHolder[h.holder]) byHolder[h.holder]={holder:h.holder,investedCost:0,marketValue:0,realizedPnl:0};
    const price = state.prices[h.code]!=null ? Number(state.prices[h.code]) : (h.shares>0 ? h.costBasis/h.shares : 0);
    byHolder[h.holder].investedCost += h.costBasis;
    byHolder[h.holder].marketValue += h.shares*price;
    byHolder[h.holder].realizedPnl += h.realizedPnl;
  }
  return Object.values(byHolder).map(s=>{
    const unrealized = s.marketValue - s.investedCost;
    return {...s, unrealized, totalPnl: unrealized+s.realizedPnl,
      returnPct: s.investedCost>0 ? (unrealized/s.investedCost*100) : 0};
  });
}

/* ================= render: shell ================= */
function renderTabs(){
  const el=document.getElementById('tabsInner');
  el.innerHTML = TABS.map(t=>`
    <button class="tab-btn ${state.activeTab===t.id?'active':''}" data-tab="${t.id}">
      <span class="num">${t.id}</span>｜${t.label}
    </button>`).join('');
  el.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.activeTab=btn.dataset.tab;
      renderTabs();
      renderActive();
    });
  });
}

function renderActive(){
  document.getElementById('holderListSub').textContent = state.holders.join('・');
  const app=document.getElementById('app');
  if(state.activeTab==='01') app.innerHTML = renderOverview();
  else if(state.activeTab==='02') app.innerHTML = renderTransactions();
  else if(state.activeTab==='03') app.innerHTML = renderHoldings();
  else if(state.activeTab==='04') app.innerHTML = renderPersonal();
  else if(state.activeTab==='05') app.innerHTML = renderCashflow();
  bindActiveEvents();
}

/* ================= 01 總覽 ================= */
function renderOverview(){
  const holdings=computeHoldings();
  const summaries=computeHolderSummary(holdings);
  const totalInvested=summaries.reduce((s,x)=>s+x.investedCost,0);
  const totalMarket=summaries.reduce((s,x)=>s+x.marketValue,0);
  const totalPnl=summaries.reduce((s,x)=>s+x.totalPnl,0);

  const cards = state.holders.map(name=>{
    const s = summaries.find(x=>x.holder===name) || {investedCost:0,marketValue:0,unrealized:0,realizedPnl:0,totalPnl:0,returnPct:0};
    return `
    <div class="card holder-card">
      <p class="holder-name">${name}</p>
      <div class="metric-row"><span class="label">投入成本</span><span class="value">${fmtMoney(s.investedCost)}</span></div>
      <div class="metric-row"><span class="label">目前市值</span><span class="value">${fmtMoney(s.marketValue)}</span></div>
      <div class="metric-row"><span class="label">未實現損益</span><span class="value ${pnlClass(s.unrealized)}">${fmtMoney(s.unrealized)}</span></div>
      <div class="metric-row"><span class="label">已實現損益</span><span class="value ${pnlClass(s.realizedPnl)}">${fmtMoney(s.realizedPnl)}</span></div>
      <div class="metric-row"><span class="label">報酬率</span><span class="value ${pnlClass(s.returnPct)}">${fmtPct(s.returnPct)}</span></div>
    </div>`;
  }).join('');

  return `
    <p class="section-title">01｜總覽</p>
    <p class="section-desc">投入成本、目前市值、損益，以及全部資產合計。</p>
    <div class="total-bar">
      <div><div class="metric-label">全部投入成本</div><div class="metric-value">${fmtMoney(totalInvested)}</div></div>
      <div><div class="metric-label">全部目前市值</div><div class="metric-value">${fmtMoney(totalMarket)}</div></div>
      <div><div class="metric-label">全部損益合計</div><div class="metric-value ${pnlClass(totalPnl)}">${fmtMoney(totalPnl)}</div></div>
    </div>
    <div class="grid-4">${cards}</div>
    ${holdings.length===0?'<p class="hint" style="margin-top:16px;">還沒有任何交易紀錄，請先到「02｜交易明細」新增第一筆買進紀錄。</p>':''}
  `;
}

/* ================= 02 交易明細 ================= */
function renderTransactions(){
  const rows=[...state.transactions].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
  const holderOptions = state.holders.map(h=>`<option value="${h}">${h}</option>`).join('');

  const stockOptions = Object.entries(state.stocks)
    .map(([code, name]) => `<option value="${code}">${code}｜${name}</option>`)
    .join('');

  const tableRows = rows.map(t=>`
    <tr>
      <td class="txt">${t.date}</td>
      <td class="txt">${t.holder}</td>
      <td class="txt">${t.code}</td>
      <td class="txt">${t.name}</td>
      <td><span class="pill ${t.action==='buy'?'buy':'sell'}">${t.action==='buy'?'買進':'賣出'}</span></td>
      <td class="num-col">${fmtNum(t.shares)}</td>
      <td class="num-col">${fmtNum(t.price,2)}</td>
      <td class="num-col">${fmtNum(t.fee,0)}</td>
      <td class="txt">${t.note||''}</td>
      <td><button class="icon-btn" data-del-tx="${t.id}" title="刪除">✕</button></td>
    </tr>`).join('');

  return `
    <p class="section-title">02｜交易明細</p>
    <p class="section-desc">記錄每一筆買進、賣出及交易費用。</p>

    <div class="form-card">
      <form id="txForm">
        <div class="form-grid">
          <div class="field"><label>日期</label><input type="date" id="tx_date" value="${todayStr()}" required></div>
          <div class="field"><label>持有人</label><select id="tx_holder">${holderOptions}</select></div>
          <div class="field"><label>選擇股票</label>
            <select id="tx_stock_select" required>
              <option value="" disabled selected>請選擇股票</option>
              ${stockOptions}
            </select>
          </div>
          <div class="field"><label>買賣別</label>
            <select id="tx_action"><option value="buy">買進</option><option value="sell">賣出</option></select>
          </div>
          <div class="field"><label>股數</label><input type="number" id="tx_shares" min="0" step="1" required></div>
          <div class="field"><label>成交價</label><input type="number" id="tx_price" min="0" step="0.01" required></div>
          <div class="field"><label>手續費／稅</label><input type="number" id="tx_fee" min="0" step="1" value="0"></div>
          <div class="field" style="grid-column:span 1;"><label>備註</label><input type="text" id="tx_note" placeholder="選填"></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">新增這筆交易</button>
          <span class="hint">新增後會自動更新總覽、持股總表與個人資產</span>
        </div>
      </form>
    </div>

    <div class="new-holder-row">
      <span class="hint">新增股票清單？</span>
      <input type="text" id="newStockCodeInput" placeholder="股票代號" style="width: 140px;">
      <input type="text" id="newStockNameInput" placeholder="股票名稱" style="width: 140px;">
      <button class="btn secondary" id="addStockBtn">新增股票</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>日期</th><th>持有人</th><th>代號</th><th>股票名稱</th><th>買賣</th>
          <th class="num-col">股數</th><th class="num-col">成交價</th><th class="num-col">費用</th><th>備註</th><th></th>
        </tr></thead>
        <tbody>${tableRows || '<tr><td colspan="10" class="txt"><div class="empty-state">還沒有交易紀錄</div></td></tr>'}</tbody>
      </table>
    </div>
  `;
}

/* ================= 03 持股總表 ================= */
function renderHoldings(){
  const holdings=computeHoldings().filter(h=>h.shares>0.0001)
    .sort((a,b)=> a.holder<b.holder?-1:a.holder>b.holder?1:(a.code<b.code?-1:1));

  const rows = holdings.map(h=>{
    const avgCost = h.shares>0 ? h.costBasis/h.shares : 0;
    const price = state.prices[h.code]!=null ? Number(state.prices[h.code]) : avgCost;
    const marketValue = h.shares*price;
    const unrealized = marketValue - h.costBasis;
    const pct = h.costBasis>0 ? unrealized/h.costBasis*100 : 0;
    return `
    <tr>
      <td class="txt">${h.holder}</td>
      <td class="txt">${h.code}</td>
      <td class="txt">${h.name}</td>
      <td class="num-col">${fmtNum(h.shares)}</td>
      <td class="num-col">${fmtNum(avgCost,2)}</td>
      <td class="num-col"><input type="number" class="price-input" data-price-code="${h.code}" value="${price.toFixed(2)}" step="0.01"></td>
      <td class="num-col">${fmtMoney(marketValue)}</td>
      <td class="num-col ${pnlClass(unrealized)}">${fmtMoney(unrealized)}</td>
      <td class="num-col ${pnlClass(pct)}">${fmtPct(pct)}</td>
    </tr>`;
  }).join('');

  return `
    <p class="section-title">03｜持股總表</p>
    <p class="section-desc">用「持有人＋股票」統計股數、平均成本、現價與未實現損益。</p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>持有人</th><th>代號</th><th>股票名稱</th>
          <th class="num-col">股數</th><th class="num-col">均價成本</th><th class="num-col">現價</th>
          <th class="num-col">市值</th><th class="num-col">未實現損益</th><th class="num-col">報酬率</th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="9"><div class="empty-state">目前沒有持股</div></td></tr>'}</tbody>
      </table>
    </div>
  `;
}

/* ================= 04 個人資產 ================= */
function renderPersonal(){
  if(!state.personalHolder || !state.holders.includes(state.personalHolder)){
    state.personalHolder = state.holders[0]||null;
  }
  const pills = state.holders.map(h=>`
    <button class="${state.personalHolder===h?'active':''}" data-personal-holder="${h}">${h}</button>`).join('');

  if(!state.personalHolder){
    return `<p class="section-title">04｜個人資產</p><p class="section-desc">分開檢視各自的投資狀況。</p><div class="empty-state">尚未設定任何持有人</div>`;
  }

  const holder=state.personalHolder;
  const allHoldings=computeHoldings();
  const myHoldings=allHoldings.filter(h=>h.holder===holder && h.shares>0.0001);
  const summary=computeHolderSummary(allHoldings).find(s=>s.holder===holder) ||
    {investedCost:0,marketValue:0,unrealized:0,realizedPnl:0,totalPnl:0,returnPct:0};

  const holdingRows = myHoldings.map(h=>{
    const avgCost=h.shares>0?h.costBasis/h.shares:0;
    const price=state.prices[h.code]!=null?Number(state.prices[h.code]):avgCost;
    const marketValue=h.shares*price;
    const unrealized=marketValue-h.costBasis;
    return `<tr>
      <td class="txt">${h.code}</td><td class="txt">${h.name}</td>
      <td class="num-col">${fmtNum(h.shares)}</td>
      <td class="num-col">${fmtNum(avgCost,2)}</td>
      <td class="num-col">${fmtNum(price,2)}</td>
      <td class="num-col">${fmtMoney(marketValue)}</td>
      <td class="num-col ${pnlClass(unrealized)}">${fmtMoney(unrealized)}</td>
    </tr>`;
  }).join('');

  const myTx=[...state.transactions].filter(t=>t.holder===holder).sort((a,b)=> a.date<b.date?1:-1);
  const txRows=myTx.map(t=>`
    <tr>
      <td class="txt">${t.date}</td><td class="txt">${t.code}</td><td class="txt">${t.name}</td>
      <td><span class="pill ${t.action==='buy'?'buy':'sell'}">${t.action==='buy'?'買進':'賣出'}</span></td>
      <td class="num-col">${fmtNum(t.shares)}</td><td class="num-col">${fmtNum(t.price,2)}</td>
    </tr>`).join('');

  return `
    <p class="section-title">04｜個人資產</p>
    <p class="section-desc">分開檢視本人、阿寶、媽媽、挖貴各自的投資狀況。</p>
    <div class="holder-select">${pills}</div>

    <div class="grid grid-2" style="margin-bottom:20px;">
      <div class="card holder-card">
        <p class="holder-name">${holder}的資產概況</p>
        <div class="metric-row"><span class="label">投入成本</span><span class="value">${fmtMoney(summary.investedCost)}</span></div>
        <div class="metric-row"><span class="label">目前市值</span><span class="value">${fmtMoney(summary.marketValue)}</span></div>
        <div class="metric-row"><span class="label">未實現損益</span><span class="value ${pnlClass(summary.unrealized)}">${fmtMoney(summary.unrealized)}</span></div>
        <div class="metric-row"><span class="label">已實現損益</span><span class="value ${pnlClass(summary.realizedPnl)}">${fmtMoney(summary.realizedPnl)}</span></div>
        <div class="metric-row"><span class="label">報酬率</span><span class="value ${pnlClass(summary.returnPct)}">${fmtPct(summary.returnPct)}</span></div>
      </div>
      <div class="card">
        <p class="holder-name">${holder}持有股票</p>
        <div class="table-wrap" style="border:none;">
          <table style="min-width:0;">
            <thead><tr><th>代號</th><th>名稱</th><th class="num-col">股數</th><th class="num-col">均價</th><th class="num-col">現價</th><th class="num-col">市值</th><th class="num-col">損益</th></tr></thead>
            <tbody>${holdingRows || '<tr><td colspan="7"><div class="empty-state">目前沒有持股</div></td></tr>'}</tbody>
          </table>
        </div>
      </div>
    </div>

    <p class="section-title" style="font-size:16px;">${holder}的交易紀錄</p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>日期</th><th>代號</th><th>名稱</th><th>買賣</th><th class="num-col">股數</th><th class="num-col">成交價</th></tr></thead>
        <tbody>${txRows || '<tr><td colspan="6"><div class="empty-state">還沒有交易紀錄</div></td></tr>'}</tbody>
      </table>
    </div>
  `;
}

/* ================= 05 資金往來 (結合股票買賣自動計算) ================= */
function renderCashflow(){
  const holderOptions = state.holders.map(h=>`<option value="${h}">${h}</option>`).join('');
  const rows=[...state.cashflow].sort((a,b)=> a.date<b.date?1:-1);

  // 1. 初始化每個人的代管現金帳戶
  const balances={};
  for(const h of state.holders) balances[h]=0;

  // 2. 計入人工紀錄的資金往來
  for(const c of state.cashflow){
    if(!(c.person in balances)) balances[c.person]=0;
    const amt=Number(c.amount)||0;
    if(c.type==='transfer_in') balances[c.person] += amt; // 預存匯款/投入資金
    else if(c.type==='return') balances[c.person] -= amt;  // 返還現金/提領
    else if(c.type==='advance') balances[c.person] -= amt; // 代墊雜項
  }

  // 3. 自動連動【股票買賣】：買股票扣錢，賣股票加錢！
  for(const t of state.transactions){
    if(!(t.holder in balances)) balances[t.holder]=0;
    const shares = Number(t.shares)||0;
    const price = Number(t.price)||0;
    const fee = Number(t.fee)||0;
    
    if(t.action === 'buy'){
      const totalCost = (shares * price) + fee;
      balances[t.holder] -= totalCost; // 買股票 -> 扣除花費
    } else if(t.action === 'sell'){
      const totalProceeds = (shares * price) - fee;
      balances[t.holder] += totalProceeds; // 賣股票 -> 資金回收加回
    }
  }

  // 4. 渲染卡片：區分「本人」與「其他家人」的標籤
  const balanceCards = Object.entries(balances).map(([name,bal])=>{
    const isMe = (name === '本人');
    
    // 標籤文字邏輯
    let labelText = '';
    let hintText = '';

    if (isMe) {
      labelText = '目前可用資金';
      hintText = bal >= 0 
        ? '（自己手頭可再投入買股的閒置現金）' 
        : '（目前買股已透支/墊付，需再投入資金）';
    } else {
      labelText = bal >= 0 ? '代管剩餘現金' : '需要補給我的金額(代墊)';
      hintText = bal >= 0 
        ? '（你手上有他的現金，可隨時幫買股或退還）' 
        : '（買股或代墊金額已超過預存，對方需補款）';
    }

    return `
    <div class="card holder-card">
      <p class="holder-name">${name}</p>
      <div class="metric-row">
        <span class="label">${labelText}</span>
        <span class="value ${bal > 0 ? 'gain' : bal < 0 ? 'loss' : 'flat'}">${fmtMoney(Math.abs(bal))}</span>
      </div>
      <div style="font-size:11px; color:var(--muted); margin-top:4px;">
        ${hintText}
      </div>
    </div>`;
  }).join('');

  const typeLabel={transfer_in:'匯款/預存資金', return:'返還/提領現金', advance:'其他雜項代墊'};
  const typePill={transfer_in:'buy', return:'sell', advance:''};

  const tableRows = rows.map(c=>`
    <tr>
      <td class="txt">${c.date}</td>
      <td class="txt">${c.person}</td>
      <td><span class="pill ${typePill[c.type]}">${typeLabel[c.type]||c.type}</span></td>
      <td class="num-col">${fmtMoney(c.amount)}</td>
      <td class="txt">${c.note||''}</td>
      <td><button class="icon-btn" data-del-cf="${c.id}" title="刪除">✕</button></td>
    </tr>`).join('');

  return `
    <p class="section-title">05｜資金往來與可用現金</p>
    <p class="section-desc">自動彙整「資金進出 + 買賣股票扣除/回收」，算出可用資金與代管金額。</p>

    <div class="grid grid-4" style="margin-bottom:20px;">${balanceCards}</div>

    <div class="form-card">
      <form id="cfForm">
        <div class="form-grid">
          <div class="field"><label>日期</label><input type="date" id="cf_date" value="${todayStr()}" required></div>
          <div class="field"><label>對象</label><select id="cf_person">${holderOptions}</select></div>
          <div class="field"><label>資金動作</label>
            <select id="cf_type">
              <option value="transfer_in">匯款 / 注入資金（預存買股金）</option>
              <option value="return">返還 / 提領現金（退還款項或提領）</option>
              <option value="advance">代墊雜項（如過戶費、額外規費）</option>
            </select>
          </div>
          <div class="field"><label>金額</label><input type="number" id="cf_amount" min="0" step="1" required></div>
          <div class="field" style="grid-column:span 2;"><label>備註</label><input type="text" id="cf_note" placeholder="選填，例如：轉帳預存買台積電"></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">新增資金紀錄</button>
          <span class="hint">買賣股票的花費與回收會由系統自動計算，無需重複在此處輸入！</span>
        </div>
      </form>
    </div>

    <p class="section-title" style="font-size:16px;">人工資金進出明細</p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>日期</th><th>對象</th><th>動作</th><th class="num-col">金額</th><th>備註</th><th></th></tr></thead>
        <tbody>${tableRows || '<tr><td colspan="6"><div class="empty-state">還沒有人工資金往來紀錄</div></td></tr>'}</tbody>
      </table>
    </div>
  `;
}

/* ================= init ================= */
async function init(){
  renderTabs();
  await fetchFromGoogleSheet();
  renderActive();
}
init();
</script>
